[project]
name = "emporio"
version = "0.1.0"
description = "Agente de atendimento da Empório da Música: dados medalhão, políticas como código e agente com ferramentas determinísticas."
readme = "README.md"
authors = [
    { name = "SamuelMauli", email = "SamuelMauli@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=2.0.0",
    "fastapi>=0.162.0",
    "fastembed>=0.9.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain-core>=1.7.6",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "numpy>=2.5.4",
    "opentelemetry-sdk>=1.45.2",
    "pdfplumber>=0.11.10",
    "prometheus-client>=0.26.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.14.6",
    "rich>=15.0.0",
    "sse-starlette>=3.6.0",
    "tenacity>=9.1.2",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
all = ["emporio[anthropic,google,vertex,bedrock,postgres,redis]"]
anthropic = [
    "langchain-anthropic>=1.7.10",
]
google = [
    "langchain-google-genai>=3.2.0",
]
bedrock = [
    "langchain-aws>=1.9.1",
]
postgres = [
    "langgraph-checkpoint-postgres>=3.2.0",
    "psycopg[binary,pool]>=3.3.8",
]
redis = [
    "redis>=8.1.0",
]
vertex = [
    "langchain-google-vertexai>=3.0",
    # CVE-2026-2472 / CVE-2026-2473 (Trivy HIGH) fixed in 1.133.0
    "google-cloud-aiplatform>=1.133.0",
]

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "hypothesis>=6.170.14",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
    "types-pyyaml>=6.0.12.20261103",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "C90", "RUF", "PT", "N", "S", "DTZ", "PL"]
ignore = ["PLR2004", "PLR0913", "RUF001", "RUF002"]  # "›" é o separador de breadcrumb

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S608", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["rank_bm25", "fastembed", "fastembed.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not live'"
markers = [
    "live: testes que chamam provedores externos (desligados por padrão)",
    "integration: exigem Postgres/Redis reais (EMPORIO_TEST_DATABASE_URL, EMPORIO_TEST_REDIS_URL); pulados sem a variável",
]

[tool.coverage.run]
source = ["src/emporio"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
