apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: emporio-api
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: emporio-api}
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300   # SSE longo: não derruba réplica por pico curto
