apiVersion: apps/v1
kind: Deployment
metadata:
  name: emporio-api
  labels: {app.kubernetes.io/name: emporio-api}
spec:
  # sem `replicas`: quem manda é o HPA
  selector:
    matchLabels: {app.kubernetes.io/name: emporio-api}
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    metadata:
      labels: {app.kubernetes.io/name: emporio-api}
    spec:
      terminationGracePeriodSeconds: 35   # > --timeout-graceful-shutdown (25) + preStop
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      initContainers:
        # O volume em /app/data esconderia o banco gerado na imagem: copia o DuckDB, os CSVs e
        # os contratos a cada deploy (artefatos reprodutíveis) e preserva SQLite já existente.
        - name: seed-data
          image: ghcr.io/samuelmauli/music-store-agent
          command:
            - sh
            - -c
            - |
              set -e
              for f in /app/data/*; do
                case "$f" in
                  *.sqlite*) [ -e "/seed/$(basename "$f")" ] || cp -a "$f" /seed/ ;;
                  *) rm -rf "/seed/$(basename "$f")"; cp -a "$f" /seed/ ;;
                esac
              done
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: data, mountPath: /seed}
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {memory: 256Mi}
      containers:
        - name: api
          image: ghcr.io/samuelmauli/music-store-agent
          ports:
            - {name: http, containerPort: 8000}
          envFrom:
            - configMapRef: {name: emporio-config}
            - secretRef: {name: emporio-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          startupProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
          lifecycle:
            preStop:
              exec: {command: [sleep, "5"]}   # deixa o endpoint sair do Service antes do SIGTERM
          volumeMounts:
            - {name: data, mountPath: /app/data}
            - {name: tmp, mountPath: /tmp}
      volumes:
        # Estado de verdade está no Postgres/Redis; /app/data é artefato reprodutível + cache.
        # Para manter SQLite entre reinícios (state_backend=sqlite, 1 réplica), use um PVC aqui.
        - name: data
          emptyDir: {sizeLimit: 1Gi}
        - name: tmp
          emptyDir: {sizeLimit: 128Mi}
