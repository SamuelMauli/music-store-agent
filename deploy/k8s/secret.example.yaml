# MODELO: não é aplicado pelo kustomize. Copie, preencha FORA do git e aplique:
#   kubectl -n emporio apply -f secret.yaml
# Todos os valores abaixo são placeholders.
apiVersion: v1
kind: Secret
metadata:
  name: emporio-secrets
type: Opaque
stringData:
  EMPORIO_SESSION_SECRET: "<token_urlsafe(32)>"
  EMPORIO_API_KEYS: '["<chave-atual>"]'      # duas chaves = rotação sem downtime
  EMPORIO_DATABASE_URL: "postgresql://<usuario>:<senha>@<host-postgres>:5432/emporio"
  EMPORIO_REDIS_URL: "redis://<host-redis>:6379/0"
  EMPORIO_LLM_API_KEY: "<chave-do-provedor-llm>"
