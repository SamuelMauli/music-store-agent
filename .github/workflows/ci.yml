name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Postgres e Redis descartáveis para os testes `integration` (sem as variáveis eles são pulados).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: emporio
          POSTGRES_PASSWORD: ci-only-not-a-secret
          POSTGRES_DB: emporio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U emporio -d emporio_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      EMPORIO_TEST_DATABASE_URL: postgresql://emporio:ci-only-not-a-secret@localhost:5432/emporio_test
      EMPORIO_TEST_REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Instalar dependências
        run: uv sync --frozen --all-extras
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type-check
        run: uv run mypy --strict src
      - name: Testes com cobertura
        run: uv run pytest -m "not live" --cov --cov-report=term

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build (carrega a imagem no daemon local)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          build-args: EXTRAS=all
          tags: emporio-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke (fake LLM, rootfs somente leitura como no Kubernetes)
        run: |
          set -euo pipefail
          docker run -d --name api -p 8000:8000 \
            --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges \
            -e EMPORIO_ENV=dev -e EMPORIO_LLM_PROVIDER=fake \
            emporio-api:ci
          for _ in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/healthz >/dev/null 2>&1 && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/healthz
          curl -fsS http://127.0.0.1:8000/readyz
          curl -fsS -N -X POST http://127.0.0.1:8000/v1/chat \
            -H 'Content-Type: application/json' \
            -d '{"message":"Quais são as promoções ativas?"}' | tee /tmp/chat.sse
          grep -q '^event: done' /tmp/chat.sse
      - name: Logs do container (em caso de falha)
        if: failure()
        run: docker logs api
      - name: Trivy (CVEs corrigíveis CRITICAL/HIGH reprovam)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: emporio-api:ci
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          exit-code: "1"
