# Casos dourados: o agente deve usar a tool certa e citar os valores reais da base.
# live: true  -> também roda no `make eval-live` (subconjunto que cabe no plano gratuito).
# fake: false -> o NLU por regras do modo offline não resolve; só vale com LLM real.

# ---------- catálogo ----------
- id: cat-violoes-ate-1000
  live: true
  turns: ["Quais violões vocês têm até R$ 1.000?"]
  expect:
    intents: [catalog_search]
    tool_calls:
      - {name: search_products, args: {max_price: 1000}}
    must_mention: ["12"]
    grounded_numbers: true

