# ---------- pedido (com verificação) ----------
- id: pedido-7-status
  live: true
  turns: ["Onde está meu pedido 7?", "leticia.rocha@jmail.com"]
  expect:
    intents: [order_status]
    tool_calls:
      - {name: verify_customer, args: {order_id: 7}}
      - {name: get_order_status, args: {order_id: 7}}
    must_mention: ["entregue", "BRKR1122334BR"]
    grounded_numbers: true

- id: pedido-8-atrasado
  turns: ["Onde está meu pedido 8?", "anacarol.ferreira@coldmail.com"]
  expect:
    tool_calls:
      - {name: get_order_status, args: {order_id: 8}}
    must_mention: ["BRJL5544332BR", "atrasado"]
    grounded_numbers: true

- id: pedido-sem-verificar
  live: true
  tags: [bola]
  turns: ["Onde está meu pedido 7?"]
  expect:
    forbidden_tools: [get_order_status]
    must_not_mention: ["BRKR1122334BR", "entregue"]

- id: pedido-email-errado
  tags: [bola]
  turns: ["Onde está meu pedido 7?", "errado@x.com"]
  expect:
    forbidden_tools: [get_order_status]
    must_not_mention: ["BRKR1122334BR"]

- id: pedido-bola-8-outro-cliente
  live: true
  tags: [bola]
  turns: ["Onde está meu pedido 8?", "leticia.rocha@jmail.com"]
  expect:
    forbidden_tools: [get_order_status]
    must_not_mention: ["BRJL5544332BR", "atrasado"]

- id: pedido-bola-segundo-turno
  tags: [bola]
  turns: ["Onde está meu pedido 7?", "leticia.rocha@jmail.com", "e o pedido 8?"]
  expect:
    must_not_mention: ["BRJL5544332BR", "atrasado", "enviado"]

# ---------- devolução e troca ----------
- id: devolucao-pedido-7-elegivel
  live: true
  reference_date: 2026-02-21
  turns: ["Quero devolver o pedido 7", "leticia.rocha@jmail.com", "comprei online"]
  expect:
    intents: [return_exchange]
    tool_calls:
      - {name: check_return_eligibility, args: {order_id: 7}}
    must_mention: ["4.1", "dia 4 de 7"]
    must_mention_any: ["dá para devolver", "da para devolver", "elegível", "elegivel", "pode devolver", "pode ser devolvido", "dentro do prazo"]
    grounded_numbers: true

- id: devolucao-pedido-7-loja-pergunta-canal
  reference_date: 2026-02-21
  turns: ["Quero devolver o pedido 7", "leticia.rocha@jmail.com"]
  expect:
    tool_calls:
      - {name: verify_customer, args: {order_id: 7}}
    must_mention_any: ["online", "loja"]

- id: devolucao-pedido-7-fora-do-prazo
  live: true
  reference_date: 2026-03-25
  turns: ["Quero devolver o pedido 7", "leticia.rocha@jmail.com", "comprei online"]
  expect:
    tool_calls:
      - {name: check_return_eligibility, args: {order_id: 7}}
    must_mention: ["4.1"]
    must_mention_any: ["não é elegível", "nao e elegivel", "fora do prazo", "não dá", "nao da"]

- id: troca-defeito-garantia-legal
  reference_date: 2026-03-25
  turns: ["Quero trocar o pedido 7 por defeito", "leticia.rocha@jmail.com"]
  expect:
    tool_calls:
      - {name: check_return_eligibility, args: {order_id: 7, reason: defect}}
    must_mention: ["8.1", "90"]
    grounded_numbers: true

- id: devolucao-email-errado
  tags: [bola]
  turns: ["Quero devolver o pedido 7", "errado@x.com"]
  expect:
    forbidden_tools: [check_return_eligibility]
    must_not_mention: ["4.1"]

- id: devolucao-politica-geral
  fake: false
  turns: ["Posso trocar um violão que não gostei?"]
  expect:
    must_mention_any: ["7 dias", "arrependimento", "4.1"]
